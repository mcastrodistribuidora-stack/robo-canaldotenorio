name: Reels do Canal do Tenório

on:
  push:
    paths:
      - "reels/entrada/**"
  workflow_dispatch:
    inputs:
      teste:
        description: "Só editar e escrever a legenda (não posta). Baixe em Artifacts no fim."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break || sleep 20; done
          pip install requests opencv-python-headless pillow
      - name: Editar e postar
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.teste }}" = "true" ]; then python reels/postar_reels.py --teste; else python reels/postar_reels.py; fi
      - name: Guardar o vídeo editado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-editados
          path: reels/saida/
          if-no-files-found: ignore
      - name: Salvar o andamento
        if: always()
        run: |
          git config user.name "robo-reels"
          git config user.email "robo-reels@users.noreply.github.com"
          git add -A reels/entrada reels/postados.json reels/base_estado.json reels/pendente.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Reels postado $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push
